name: Native Desktop CI

on:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - 'native/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - '.scripts/native/**'
      - '.github/workflows/native-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'public/workers/**'
  pull_request:
    paths:
      - 'native/**'
      - 'macos/**'
      - 'windows/**'
      - 'linux/**'
      - '.scripts/native/**'
      - '.github/workflows/native-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'public/workers/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    name: native-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Smoke test (loopback API + Host rejection)
        run: npm run native:smoke-test

      - name: Build Linux shell package
        run: npm run native:build:linux

  native-wallet:
    name: native-wallet-unlock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Skip cleanly when the secret is not configured (forks / first setup).
    if: ${{ secrets.QRL_TEST_MNEMONIC != '' }}
    needs: native-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser
          fi

      - name: Wallet unlock test
        env:
          QRL_TEST_MNEMONIC: ${{ secrets.QRL_TEST_MNEMONIC }}
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run native:wallet-test
