<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRL Wallet</title>
  <link rel="stylesheet" href="/ui.css" />
  <link rel="icon" href="/img/icon.svg" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="/img/qrl-full-logo.svg" alt="QRL" class="brand-logo" />
        <span class="brand-sub">Native Wallet</span>
      </div>
      <div class="topbar-meta">
        <label class="network-picker">
          <span>Network</span>
          <select id="networkSelect"></select>
        </label>
        <span id="connectionBadge" class="badge">connecting…</span>
      </div>
    </header>

    <main id="viewRoot" class="view-root"></main>
  </div>

  <script src="/vendor/qrllib/offline-libjsqrl.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
