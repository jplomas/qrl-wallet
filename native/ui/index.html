<!DOCTYPE html>
<html lang="en" data-theme="qrl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRL Wallet</title>
  <link rel="stylesheet" href="/tailwind-output.css" />
  <link rel="stylesheet" href="/ui.css" />
  <link rel="icon" href="/img/icon.svg" />
</head>
<body class="min-h-screen">
  <div class="native-shell min-h-screen flex flex-col">
    <header class="navbar bg-base-200/80 backdrop-blur-md border-b border-base-content/10 sticky top-0 z-20 px-4 lg:px-6">
      <div class="flex-1 gap-3 items-center">
        <img src="/img/qrl-full-logo.svg" alt="QRL" class="h-7 w-auto" />
        <span class="text-xs uppercase tracking-widest text-base-content/50 font-medium hidden sm:inline">Native Wallet</span>
      </div>
      <div class="flex-none gap-3 items-center">
        <label class="flex items-center gap-2 text-sm text-base-content/70">
          <span class="hidden sm:inline">Network</span>
          <select id="networkSelect" class="select select-bordered select-sm bg-base-100"></select>
        </label>
        <span id="connectionBadge" class="badge badge-ghost badge-sm">connecting…</span>
      </div>
    </header>

    <main id="viewRoot" class="flex-1 w-full max-w-3xl mx-auto px-4 py-8 lg:py-12"></main>
  </div>

  <script src="/vendor/qrllib/offline-libjsqrl.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
